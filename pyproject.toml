[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portkitchen"
version = "0.1.0"
description = "Safety-first Samsung One UI donor firmware staging and logical partition assembly"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{name = "WatchFact"}]

[project.scripts]
portkitchen = "portkitchen.__main__:main"

[tool.setuptools.packages.find]
include = ["portkitchen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
