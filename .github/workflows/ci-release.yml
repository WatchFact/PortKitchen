name: Test and publish PortKitchen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest build
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m build
  release:
    name: Publish source release after tests
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - name: Package the application and source
        run: |
          python -m build
          VERSION=$(python -c 'from portkitchen import __version__; print(__version__)')
          git archive --format=zip --output="dist/PortKitchen-source-v${VERSION}.zip" HEAD
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub release (application source only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "${TAG} was already released; no asset replacement or tag rewrite"
          else
            gh release create "$TAG" dist/* --target "$SHA" \
              --title "PortKitchen ${TAG} – Developer Preview" --prerelease \
              --notes 'One UI donor/target review and firmware staging with GitHub Actions. Includes unapproved profile generator and audited target-super layout exports. NOT a flash-ready ROM.'
          fi
