name: Test and publish PortKitchen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest build
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m build
  release:
    name: Source-code GitHub release
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - name: Package the application
        run: |
          python -m build
          git archive --format=zip --output=dist/PortKitchen-source-v0.1.0.zip HEAD
      - name: Create release (source only, never firmware)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already released; skipping duplicate.'
          else
            gh release create v0.1.0 dist/* --target "$SHA" --title 'PortKitchen v0.1.0 – Developer Preview' --prerelease --notes 'Initial One UI donor/target image extraction, validation, image staging, optional super image assembly and GitHub Actions workflow. NOT a flash-ready ROM. Hardware-specific porting is still required.'
          fi
