name: Prepare One UI Port
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Review firmware first (recommended), or stage a reviewed port'
        type: choice
        required: true
        options: [review, stage]
        default: review
      donor_url:
        description: 'Direct HTTPS link to donor ZIP, TAR.MD5 or AP firmware'
        required: true
        type: string
      target_url:
        description: 'Direct HTTPS link to target stock firmware'
        required: true
        type: string
      profile_path:
        description: 'Stage mode: profile in repository config/ (e.g. config/s10plus.json)'
        required: false
        type: string
      profile_url:
        description: 'Stage mode alternative: direct HTTPS link to reviewed JSON profile'
        required: false
        type: string
      donor_sha256:
        description: 'Optional expected SHA-256 checksum of donor archive'
        required: false
        type: string
      target_sha256:
        description: 'Optional expected SHA-256 checksum of target archive'
        required: false
        type: string
      assemble_super:
        description: 'Stage mode: create super.img only with reviewed profile.super geometry'
        type: boolean
        default: false
      artifact_days:
        description: 'Artifact retention days (1–7)'
        type: choice
        options: ['1', '3', '7']
        default: '1'
permissions:
  contents: read
jobs:
  firmware:
    name: ${{ inputs.mode == 'review' && 'Inspect firmware compatibility' || 'Stage reviewed One UI images' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h .
      - name: Install firmware tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 android-sdk-libsparse-utils git
          git init -q /tmp/aosp-partition-tools
          git -C /tmp/aosp-partition-tools remote add origin https://github.com/Rprop/aosp15_partition_tools.git
          git -C /tmp/aosp-partition-tools fetch -q --depth=1 origin 5e92a5d504de33414318ced8bad5507440bb8c30
          git -C /tmp/aosp-partition-tools checkout -q FETCH_HEAD
          mkdir -p "$HOME/.local/bin"
          for binary in lpmake lpunpack lpdumps simg2img; do
            install -m 0755 "/tmp/aosp-partition-tools/linux_glibc_x86_64/$binary" "$HOME/.local/bin/$binary"
          done
          ln -s lpdumps "$HOME/.local/bin/lpdump"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Download firmware, verify checksums, and locate reviewed profile
        env:
          MODE: ${{ inputs.mode }}
          DONOR_URL: ${{ inputs.donor_url }}
          TARGET_URL: ${{ inputs.target_url }}
          PROFILE_URL: ${{ inputs.profile_url }}
          PROFILE_PATH: ${{ inputs.profile_path }}
          DONOR_SHA: ${{ inputs.donor_sha256 }}
          TARGET_SHA: ${{ inputs.target_sha256 }}
        run: |
          mkdir -p work
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.parse, shutil
          def download(url, filename, name):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(name + ': only standard HTTPS URLs are allowed')
              print('Downloading', name, '(URL omitted from logs)')
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location',
                 '--retry', '3', '--proto', '=https', '--proto-redir', '=https',
                 '--connect-timeout', '30', '--output', str(filename), url], check=True)
          for name in ('donor', 'target'):
              filename = pathlib.Path('work') / (name + '.fw')
              download(os.environ[name.upper() + '_URL'], filename, name)
              digest = os.environ.get(name.upper() + '_SHA', '').strip().lower()
              if digest:
                  if len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                      raise SystemExit(name + ': SHA-256 must be 64 hex characters')
                  h = hashlib.sha256()
                  with filename.open('rb') as f:
                      for chunk in iter(lambda: f.read(4*1024*1024), b''):
                          h.update(chunk)
                  if h.hexdigest() != digest:
                      raise SystemExit(name + ': SHA-256 mismatch; stopping')
          if os.environ['MODE'] == 'stage':
              path = os.environ['PROFILE_PATH'].strip()
              url = os.environ['PROFILE_URL'].strip()
              if path and url:
                  raise SystemExit('Use profile_path OR profile_url, not both')
              if path:
                  allowed = pathlib.Path('config').resolve()
                  source = pathlib.Path(path).resolve()
                  if not source.is_relative_to(allowed) or not source.is_file() or source.suffix != '.json':
                      raise SystemExit('profile_path must name a checked-in config/*.json file')
                  shutil.copyfile(source, 'work/profile.json')
              elif url:
                  download(url, pathlib.Path('work/profile.json'), 'profile')
              else:
                  raise SystemExit('Stage mode requires a reviewed profile_path or profile_url. Use review mode first.')
          PY
          df -h .
      - name: Generate review report and profile template
        if: inputs.mode == 'review'
        run: python -m portkitchen profile --donor work/donor.fw --target work/target.fw --output output
      - name: Stage reviewed partitions
        if: inputs.mode == 'stage'
        env:
          ASSEMBLE: ${{ inputs.assemble_super }}
        run: |
          if [[ "$ASSEMBLE" == true ]]; then
            python -m portkitchen build --donor work/donor.fw --target work/target.fw --profile work/profile.json --output output --assemble-super
          else
            python -m portkitchen build --donor work/donor.fw --target work/target.fw --profile work/profile.json --output output
          fi
      - name: Add action summary
        if: success()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## PortKitchen firmware $MODE"
            echo "The downloadable artifact is a review or staging output, **not a verified flashable ROM**."
            echo "See the included manifest or review.json before doing device-specific work."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review or staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortKitchen-${{ inputs.mode }}-${{ github.run_number }}
          path: output/
          retention-days: ${{ fromJSON(inputs.artifact_days) }}
          compression-level: 0
          if-no-files-found: error
